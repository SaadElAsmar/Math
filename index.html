<head>

<style>
:root{color-scheme:light dark;--bg:light-dark(#fff,#14171a);--ink:light-dark(#1b1d1f,#e9ecee);--mute:light-dark(#5c6268,#a3abb2);--line:light-dark(#dfe3e6,#2c3236);--ac:light-dark(#0b6e6e,#5fd1c8)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Source Serif 4",Georgia,serif}
.wrap{max-width:720px;margin:0 auto;padding:clamp(24px,5vw,56px) max(5vw,16px)}
h1{font-size:clamp(28px,5vw,40px);line-height:1.1;margin:0 0 6px}
.sub{color:var(--mute);margin:0 0 28px}
ul{list-style:none;padding:0;margin:0;border-top:2px solid var(--ink)}

a:hover b,a:focus-visible b{color:var(--ac)}
a span{display:block;color:var(--mute);font-size:15px}
</style>
</head>
